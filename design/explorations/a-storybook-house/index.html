<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HOMEBASE · Direction A · Storybook House</title>
<style>
  :root {
    --sky-top: #a9daf5; --sky-low: #f1faff; --hill-far: #cfe9c6; --hill-near: #a9dc98;
    --lawn-top: #9fd98a; --lawn-low: #6fbf68; --sun: #ffd45e; --sun-halo: #fff3c4;
    --wall: #fff6e6; --wall-shade: #f3e2c2; --glow: 0; --star: 0; --pond-a: #9fe0e2; --pond-b: #4fb3c2;
    --cloud: #ffffff; --ink: #3a2e4d; --window: #cdeeff;
  }
  :root.night {
    --sky-top: #232a5c; --sky-low: #5b5f9e; --hill-far: #3e5a78; --hill-near: #2f5a5a;
    --lawn-top: #2f6b57; --lawn-low: #234f4a; --sun: #f4f1ff; --sun-halo: #b9b5ee;
    --wall: #f1e3cc; --wall-shade: #dcc7a3; --glow: 1; --star: 1; --pond-a: #4a6fa8; --pond-b: #2c4780;
    --cloud: #8f93c9; --window: #39407a;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(var(--sky-top) 0 50%, var(--lawn-low) 50% 100%); }
  svg { display: block; width: 100vw; height: 100vh; }
  .portrait { display: none; }
  @media (max-aspect-ratio: 3/4) { .landscape { display: none; } .portrait { display: block; } }
  .s-sky-top { stop-color: var(--sky-top); } .s-sky-low { stop-color: var(--sky-low); }
  .s-lawn-top { stop-color: var(--lawn-top); } .s-lawn-low { stop-color: var(--lawn-low); }
  .s-halo { stop-color: var(--sun-halo); } .s-pond-a { stop-color: var(--pond-a); } .s-pond-b { stop-color: var(--pond-b); }
  .f-hill-far { fill: var(--hill-far); } .f-hill-near { fill: var(--hill-near); }
  .f-sun { fill: var(--sun); } .f-halo { fill: var(--sun-halo); } .f-cloud { fill: var(--cloud); }
  .f-wall { fill: var(--wall); } .f-wall-shade { fill: var(--wall-shade); } .f-window { fill: var(--window); }
  .glow { opacity: var(--glow); } .stars { opacity: var(--star); }
  .dim { opacity: calc(1 - var(--glow) * 0.28); }
  @media (prefers-reduced-motion: no-preference) {
    .drift { animation: drift 90s linear infinite; }
    .drift2 { animation: drift 130s linear infinite reverse; }
    .bob { animation: bob 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .sway { animation: sway 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .puff { animation: puff 9s ease-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .puff.p2 { animation-delay: 3s; } .puff.p3 { animation-delay: 6s; }
    .hover { animation: hover 3.2s ease-in-out infinite; }
    .blink { animation: blink 5.5s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .twinkle { animation: twinkle 4s ease-in-out infinite; }
  }
  @keyframes drift { from { transform: translateX(-60px); } to { transform: translateX(120px); } }
  @keyframes bob { 0%,100% { transform: rotate(-1.6deg) translateY(0); } 50% { transform: rotate(1.6deg) translateY(-5px); } }
  @keyframes sway { 0%,100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
  @keyframes puff { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-70px) scale(1.25); opacity: 0; } }
  @keyframes hover { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
  @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
  text { font-family: ui-rounded, "Nunito", "Trebuchet MS", system-ui, sans-serif; font-weight: 800; fill: var(--ink); }
</style>
</head>
