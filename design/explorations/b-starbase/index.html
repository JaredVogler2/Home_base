<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>HOMEBASE · Direction B — Starbase Home</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #161d4a; overflow: hidden; }
  .defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .portrait { display: none; }
  @media (max-aspect-ratio: 3/4) {
    .landscape { display: none; }
    .portrait { display: block; }
  }
  text {
    font-family: Inter, ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-weight: 800; letter-spacing: .01em;
  }

  /* Idle motion: transform and opacity only, nothing faster than once a second. */
  /* The sky tells the time. index.html#morning shows the dawn palette. */
  .day-only { display: none; }
  body:has(#morning:target) { background: #3a52b0; }
  body:has(#morning:target) .night-only { display: none; }
  body:has(#morning:target) .day-only { display: inline; }
  body:has(#morning:target) .stars { opacity: .22; }
  body:has(#morning:target) .sky0 { stop-color: #3a52b0; }
  body:has(#morning:target) .sky1 { stop-color: #7f92e8; }
  body:has(#morning:target) .sky2 { stop-color: #ffc9b6; }
  .sh { opacity: var(--sh, .4); }
  .afloat { --sh: 0; }
  .twinkle  { animation: twinkle 5.5s ease-in-out infinite; }
  .twinkle.d1 { animation-delay: -1.3s; } .twinkle.d2 { animation-delay: -2.7s; }
  .twinkle.d3 { animation-delay: -3.9s; } .twinkle.d4 { animation-duration: 7s; animation-delay: -4.6s; }
  .breathe  { animation: breathe 6s ease-in-out infinite; }
  .breathe.d1 { animation-delay: -2s; } .breathe.d2 { animation-delay: -4s; }
  .bob      { animation: bob 5s ease-in-out infinite; }
  .hover    { animation: bob 3.6s ease-in-out infinite; }
  .pulse    { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .blink    { animation: blink 6.5s linear infinite; transform-box: fill-box; transform-origin: center top; }
  .wave     { animation: wave 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 85% 15%; }
  .starpop  { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }
  @keyframes bob     { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes pulse   { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  @keyframes blink   { 0%, 95.5%, 100% { transform: scaleY(0); } 97.5% { transform: scaleY(1); } }
  @keyframes wave    { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-9deg); } }
  @media (prefers-reduced-motion: reduce) {
    .twinkle, .breathe, .bob, .hover, .pulse, .blink, .wave, .starpop { animation: none; }
  }
</style>
</head>
<body>

      <rect x="-120" y="-110" width="240" height="220" rx="74" fill="url(#g-hull)"/>
