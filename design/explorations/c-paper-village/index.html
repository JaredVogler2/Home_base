<!-- Design exploration, not product code. Static: inline SVG + CSS only, no scripts, no network. Synthetic content. -->
<style>
html,body{height:100%;margin:0;background:#CBE5E3;overflow:hidden}
.scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.portrait{display:none}
@media (max-aspect-ratio:3/4){.landscape{display:none}.portrait{display:block}}
.a-sun{animation:spin 160s linear infinite}
.a-cloud1{animation:drift 44s ease-in-out infinite alternate}
.a-cloud2{animation:drift 58s ease-in-out infinite alternate-reverse}
.a-flag{animation:sway 3.8s ease-in-out infinite alternate}
.a-bob{animation:bob 3.4s ease-in-out infinite alternate}
.a-wave{animation:wave 2.6s ease-in-out infinite alternate}
.a-blink{animation:blink 5.6s ease-in-out infinite}
.a-bell{animation:swing 2.8s ease-in-out infinite alternate}
.a-token{animation:dip 3.2s ease-in-out infinite alternate}
.a-hand{animation:tick 6s ease-in-out infinite alternate}
.a-pennant{animation:flutter 3.2s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(6deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes wave{from{transform:rotate(-7deg)}to{transform:rotate(9deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.12)}}
@keyframes swing{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
@keyframes dip{from{transform:translateY(-12px)}to{transform:translateY(2px)}}
@keyframes tick{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
@keyframes flutter{from{transform:skewY(-5deg)}to{transform:skewY(7deg)}}
@media (prefers-reduced-motion:reduce){.scene *{animation:none!important}}
</style>
</head>
